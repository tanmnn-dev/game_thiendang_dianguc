version: '3.8'

services:
  thien-dang-dianguc-game:
    container_name: thien-dang-dianguc-game
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./logs:/app/logs
      - ./database:/app/database
