services:
  thien-dang-dianguc-game:
    container_name: thien-dang-dianguc-game
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./logs:/app/logs
      - ./database:/app/database

  tunnel:
    container_name: thien-dang-dianguc-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://thien-dang-dianguc-game:3000
    depends_on:
      - thien-dang-dianguc-game
